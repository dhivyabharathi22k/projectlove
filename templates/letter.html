
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Secret ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #240018, #800040);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 15px;
        }

        h1 {
            color: pink;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-top: 20px;
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #ff4d88;
            color: white;
            cursor: pointer;
        }

        p {
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Our Little Secret 💌</h1>

    <p>
        When did our beautiful journey begin?
        <br>
        Enter our special date ❤️
    </p>

    <form method="POST">

        <input
            type="text"
            name="date"
            placeholder="DD-MM-YYYY"
            required
        >

        <button type="submit">
            UNLOCK MY HEART ❤️
        </button>

    </form>

    <p>{{ message }}</p>

</body>
</html>
