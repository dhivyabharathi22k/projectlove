
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Secret ❤️</title>

    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/surprise1.jpeg')  }}');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: scroll;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 15px;
        }

        h1 {
            color: #e60073;
        }
        h2 {
            color: #e60073;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-top: 20px;
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #ff4d88;
            color: white;
            cursor: pointer;
        }

        p {
            line-height: 1.8;

        }
        a.hover {
            background: #820792;
        }
    </style>
</head>

<body>

    <h1>Our Little Secret 💌</h1>

    <p>
        When did our beautiful journey begin?
        <br>
        Enter our special date ❤️
    </p>

    <form action="/letter" method="POST">
        
        <input
            type="text"
            name="date"
            placeholder="DD-MM-YYYY"
            required
        >
        <br><br>
        <h2> Enter My birth date</h2>
        <input
            type="text"
            name="birthdate"
            placeholder="DD-MM-YYYY"
            required
        >
        <br><br>
        <button type="submit">
            UNLOCK MY HEART ❤️
        </button>

    </form>

    <p>{{ message }}</p>

</body>
</html>
